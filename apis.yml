aid: resolyst
name: Resolyst
description: Resolyst is a specialty-care platform that positions itself as the intelligence
  layer for AI-enabled specialty care, extending the reach of the world's leading clinicians
  with continuous, research-first expertise. Rather than episodic consultations, Resolyst
  provides ongoing multidisciplinary medical oversight for patients with chronic conditions
  through specialist nurses, pharmacists, dieticians, physiotherapists and psychologists,
  connecting patients with local and international experts, embedding clinical research
  into care pathways, and convening condition-specific international expert panels for
  second opinions and clinical pathway oversight. Backed by Seedcamp, it is tracked in
  the API Evangelist network as a company profile; no public API, developer portal, or
  technical documentation surface is currently published.
